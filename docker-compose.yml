services:
  postgres:
    image: postgres:16-alpine
    container_name: agrovibes-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agrovibes
    volumes:
      - agrovibes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agrovibes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agrovibes_pgdata:
